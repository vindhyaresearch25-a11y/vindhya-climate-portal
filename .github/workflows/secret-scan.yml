name: Secret scan

# FINAL_PROMPT.md Phase 3.2. Runs the same pattern the pre-commit hook
# uses (tools/pre-commit), but over the whole push's diff on GitHub's
# servers -- catches anything committed with --no-verify or from a clone
# that never installed the local hook. Fails the build; does not attempt
# to redact or auto-fix anything (this repo's rule: report and stop, never
# silently rewrite).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # only need this push's diff against its parent

      - name: Scan the pushed diff for credential-shaped strings
        run: |
          PATTERN='ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[A-Za-z0-9_-]{30,}|hf_[A-Za-z0-9]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|"api_key"[[:space:]]*:|"apiKey"[[:space:]]*:|"token"[[:space:]]*:|"secret"[[:space:]]*:|"password"[[:space:]]*:'

          # First push to a branch (or a shallow history edge) has no
          # parent to diff against -- fall back to scanning the full tree
          # rather than skipping the check.
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            DIFF_RANGE="HEAD~1..HEAD"
            hits=$(git diff -U0 "$DIFF_RANGE" -- . ':!*.lock' \
              | grep -E '^\+' | grep -vE '^\+\+\+' \
              | grep -inE "$PATTERN" || true)
          else
            hits=$(grep -rInE "$PATTERN" . \
              --exclude-dir=.git --exclude-dir=node_modules 2>/dev/null || true)
          fi

          if [ -n "$hits" ]; then
            echo "::error::Possible secret found in this push. See below."
            echo "$hits"
            exit 1
          fi
          echo "No credential-shaped strings found."
