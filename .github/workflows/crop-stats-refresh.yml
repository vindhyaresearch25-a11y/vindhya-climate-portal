name: Crop statistics refresh

# Runs entirely on GitHub servers. Unlike mandi prices, this source
# (data.gov.in resource 35be999b-0208-4354-b557-f6ca9a5355de) is a static
# historical dataset last updated by its publisher on 2021-07-13 -- it does
# not move daily. This workflow checks monthly (in case the publisher ever
# refreshes it) plus a manual trigger, rather than running every day.
#
# National as of 2026-08-02, 733 districts across 36 states/UTs -- this
# resource paginates (5 districts alone took "several hundred sequential
# requests"), so fetching all 733 in a single run risks a multi-hour job.
# Instead each scheduled run fetches ONE batch of 6 states, chosen by
# calendar month so all 6 batches (36 states) cycle through over 6 months;
# fetch_crop_stats.py MERGES into the existing file rather than
# overwriting it, so a batch run never erases another batch's already-
# fetched states. Use workflow_dispatch's `states` input to fetch specific
# states on demand instead of waiting for their scheduled month.

on:
  schedule:
    - cron: "0 4 1 * *"   # 04:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      states:
        description: "Comma-separated state names to fetch (default: this month's scheduled batch)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pick this run's state batch
        id: batch
        run: |
          if [ -n "${{ github.event.inputs.states }}" ]; then
            echo "states=${{ github.event.inputs.states }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MONTH=$(date +%-m)
          INDEX=$(( (MONTH - 1) % 6 ))
          BATCHES=(
            "Andaman & Nicobar Island,Andhra Pradesh,Arunanchal Pradesh,Assam,Bihar,Chandigarh"
            "Chhattisgarh,Dadra & Nagar Havelli and Daman & Diu,Delhi,Goa,Gujarat,Haryana"
            "Himachal Pradesh,Jammu & Kashmir,Jharkhand,Karnataka,Kerala,Ladakh"
            "Lakshadweep,Madhya Pradesh,Maharashtra,Manipur,Meghalaya,Mizoram"
            "Nagaland,Odisha,Puducherry,Punjab,Rajasthan,Sikkim"
            "Tamil Nadu,Telangana,Tripura,Uttar Pradesh,Uttarakhand,West Bengal"
          )
          echo "states=${BATCHES[$INDEX]}" >> "$GITHUB_OUTPUT"
          echo "Month $MONTH -> batch $INDEX: ${BATCHES[$INDEX]}"

      - name: Fetch district-wise crop statistics for this batch
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python scripts/fetch_crop_stats.py --states "${{ steps.batch.outputs.states }}"

      - name: Validate the written file
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          p = Path("dashboard/data/crop_stats.json")
          if not p.exists():
              sys.exit("crop_stats.json was not written")

          d = json.loads(p.read_text())
          fails = []

          if "metadata" not in d:
              fails.append("missing metadata block")

          for slug, dist in d.get("districts", {}).items():
              for r in dist.get("records", []):
                  if r["area_ha"] < 0 or r["production_tonnes"] < 0:
                      fails.append(f"{slug}/{r['crop']}/{r['year']}: negative area or production")
                  if not r.get("season") or not r.get("crop"):
                      fails.append(f"{slug}/{r['year']}: missing season or crop label")

          if fails:
              print("VALIDATION FAILED")
              for f in fails[:20]:
                  print("  -", f)
              sys.exit(1)

          total = sum(x["count"] for x in d["districts"].values())
          print(f"Validated {total} crop-statistic rows across "
                f"{len(d.get('districts', {}))} districts nationally.")
          PY

      - name: Commit if data changed
        run: |
          git config user.name  "vindhya-data-bot"
          git config user.email "actions@github.com"
          git add dashboard/data/crop_stats.json
          if git diff --staged --quiet; then
            echo "Crop statistics unchanged since the last run."
          else
            git commit -m "chore(data): refresh crop statistics [skip ci]"
            git push
          fi
