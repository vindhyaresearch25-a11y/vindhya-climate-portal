name: Verify authoritative data sources

# Runs entirely on GitHub servers. Nothing is downloaded to any local machine.
on:
  schedule:
    - cron: "0 3 * * 1"        # every Monday 03:00 UTC
  workflow_dispatch:            # manual "Run workflow" button
  push:
    paths:
      - "scripts/fetch_verify_sources.py"
      - ".github/workflows/verify-data.yml"
      # Added 2026-09-02: the metadata/plausibility checks below exist to
      # catch a bad DATA file, but this workflow never ran when a data file
      # changed -- only on the Monday cron or the manual button, so a bad
      # file could sit live for up to a week. Data pushes now trigger it.
      - "dashboard/data/**"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate published data files
        run: |
          python - <<'PY'
          import json, sys, glob
          from pathlib import Path

          fails = []

          # 1. No synthetic districts may reappear
          d = json.load(open('dashboard/data/mp_climate_data.json'))
          allowed = {'bhopal', 'indore', 'jabalpur', 'rewa', 'sidhi'}
          extra = set(d['districts']) - allowed
          if extra:
              fails.append(f"unexpected districts in climate data: {sorted(extra)}")
          if 'metadata' not in d:
              fails.append("mp_climate_data.json is missing its metadata block")

          # 2. Every dashboard JSON must declare provenance.
          #
          # Was `glob.glob('dashboard/data/*.json')` -- NON-recursive, so it
          # checked 10 files out of ~5,200 served ones and saw nothing inside
          # climate/, ndvi/, cmip6_2040/, groundwater/, soil_moisture/,
          # advisory/, crop_stats_des*/, horticulture_stats/, state_reports/,
          # crop_yield/, knowledge_base/, validation/ or crop_insurance_pilot/.
          # 99.8% of the served data was unchecked. (The recursive idiom was
          # already used by the GeoJSON check below; it simply was not applied
          # here.) It also only tested that the KEY existed, so `"metadata": {}`
          # passed -- which is how two manifest files with no source, no CRS and
          # no last_updated sailed through. Both fixed 2026-09-02.
          #
          # REQUIRED_KEYS is the contract stated in CLAUDE.md and
          # docs/DATA_SOURCES.md. Two documented exemptions, per-directory and
          # deliberately narrow -- a blanket waiver would defeat the check:
          #   - CRS on tabular files that carry no geometry at all (DES/ICRISAT
          #     crop tables, horticulture, the knowledge-base index). A
          #     coordinate reference system is not a meaningful property of a
          #     table of crop areas.
          #   - resolution on files whose unit is an administrative area rather
          #     than a grid (advisory flags, per-district crop tables).
          # Anything not listed here must carry all five keys.
          REQUIRED_KEYS = ('source', 'resolution', 'CRS', 'processing', 'last_updated')
          EXEMPT = {
              'crop_stats_des':            ('resolution', 'CRS'),
              'crop_stats_des_by_district':('resolution', 'CRS'),
              'crop_yield':                ('resolution', 'CRS'),
              'horticulture_stats':        ('resolution', 'CRS'),
              'knowledge_base':            ('resolution', 'CRS'),
              'state_reports':             ('resolution', 'CRS'),
              'advisory':                  ('resolution', 'CRS'),
              'crop_list.json':            ('resolution', 'CRS'),
              'crop_stats.json':           ('resolution', 'CRS'),
              'crop_stats_comparison.json':('resolution', 'CRS'),
              'mandi_prices.json':         ('resolution', 'CRS'),
              'sources_manifest.json':     ('resolution', 'CRS'),
              'forecast_2040.json':        ('resolution', 'CRS'),
              'dicra_ndvi.json':           ('resolution',),
              'climate_manifest.json':     ('resolution', 'CRS'),
              'ndvi_manifest.json':        ('resolution', 'CRS'),
          }

          def exempt_for(path):
              parts = Path(path).parts
              waived = set()
              for token in list(parts) + [Path(path).name]:
                  waived.update(EXEMPT.get(token, ()))
              return waived

          meta_fails = []
          for f in glob.glob('dashboard/data/**/*.json', recursive=True):
              try:
                  j = json.load(open(f))
              except Exception as e:
                  meta_fails.append(f"{f} is not valid JSON: {e}")
                  continue
              if not isinstance(j, dict):
                  # A top-level array can carry no metadata at all. Previously
                  # waved through by an isinstance() guard; now called out.
                  meta_fails.append(f"{f} is a top-level JSON array, so it can carry no metadata block")
                  continue
              m = j.get('metadata')
              if not isinstance(m, dict) or not m:
                  meta_fails.append(f"{f} has no usable metadata block")
                  continue
              waived = exempt_for(f)
              missing = [k for k in REQUIRED_KEYS if k not in m and k not in waived]
              if missing:
                  meta_fails.append(f"{f} metadata is missing {missing}")
          if meta_fails:
              # Report a bounded sample so a systemic miss doesn't bury the log.
              fails.append(f"{len(meta_fails)} data files failed the metadata contract; first 20:")
              fails.extend('    ' + x for x in meta_fails[:20])

          # 3. Physical plausibility of published village indices
          bad = 0
          for dk, dist in d['districts'].items():
              for vid, v in (dist.get('villages') or {}).items():
                  ix = v.get('indices') or {}
                  r = ix.get('annual_rain_mm')
                  tx = ix.get('max_summer_tmax')
                  hw = ix.get('heatwave_days')
                  if r is not None and not (0 <= r <= 6000): bad += 1
                  if tx is not None and not (20 <= tx <= 55): bad += 1
                  if hw is not None and not (0 <= hw <= 180): bad += 1
          if bad:
              fails.append(f"{bad} village index values outside physically plausible ranges")

          # 4. GeoJSON structural check
          for f in glob.glob('dashboard/**/*.geojson', recursive=True):
              g = json.load(open(f))
              if g.get('type') != 'FeatureCollection' or not g.get('features'):
                  fails.append(f"{f} is not a populated FeatureCollection")

          if fails:
              print("VALIDATION FAILED")
              for x in fails: print("  -", x)
              sys.exit(1)
          print("All published data files passed validation.")
          PY

      - name: Guard against synthetic data reintroduction
        run: |
          if grep -rn "np\.random\|random\.uniform\|random\.choice\|random\.randint" \
               scripts/ --include="*.py"; then
            echo "Random generation found in pipeline scripts. Rejected."
            exit 1
          fi
          echo "No random generation in pipeline scripts."

      - name: Run unit tests
        run: |
          # Install the full project dependency set (requirements.txt), not a
          # hand-picked subset -- tests/test_indices.py imports
          # scripts/02_compute_indices.py, which needs tqdm at module load
          # time. A minimal "numpy pandas scipy pytest" list previously
          # missed that and failed every run with ModuleNotFoundError.
          pip install --quiet -r requirements.txt
          python -m pytest tests/ -q

      # Network-dependent. An unreachable upstream mirror must not fail the run:
      # the published data in this repository is validated above and is
      # unaffected. Integrity failures are still reported in the manifest.
      # scripts/fetch_verify_sources.py retries each download up to 3 times
      # internally before giving up on a source; continue-on-error here is
      # the outer safety net for a source that's down for the whole run.
      - name: Cross-check upstream authoritative sources
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/fetch_verify_sources.py

      - name: Commit manifest if it changed
        run: |
          git config user.name  "vindhya-data-bot"
          git config user.email "actions@github.com"
          git add docs/data_manifest.json
          if git diff --staged --quiet; then
            echo "Manifest unchanged."
          else
            git commit -m "chore(data): refresh source verification manifest [skip ci]"
            git push
          fi
