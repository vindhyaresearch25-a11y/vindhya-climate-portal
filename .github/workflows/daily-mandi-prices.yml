name: Daily mandi prices

# Runs entirely on GitHub servers. Fetches AGMARKNET daily prices from
# data.gov.in and commits the result, so GitHub Pages can serve it as a
# static file with no backend and no API key in the browser.
#
# National as of 2026-08-02: all 733 districts (36 states/UTs), one request
# each -- expect ~15-30 minutes depending on upstream latency and retries,
# comfortably under the job timeout below. A district with no AGMARKNET
# match for its Survey-of-India name is a real, expected per-district
# failure (recorded in its own "note"), not a build failure.
#
# Setup: register at https://data.gov.in, then add the key as a repository
# secret named DATA_GOV_API_KEY (Settings -> Secrets and variables ->
# Actions -> New repository secret). Without it the script falls back to the
# shared public sample key, which is heavily rate limited and much slower
# at this scale.

on:
  schedule:
    # 12:30 IST — after the morning APMC session is published upstream
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mandi-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch AGMARKNET daily prices
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python scripts/fetch_mandi_prices.py

      - name: Validate the written file
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          p = Path("dashboard/data/mandi_prices.json")
          if not p.exists():
              sys.exit("mandi_prices.json was not written")

          d = json.loads(p.read_text())
          fails = []

          if "metadata" not in d:
              fails.append("missing metadata block")
          # National scale: exact set varies as district-name matching
          # against AGMARKNET improves, but the count should stay close to
          # the Survey of India district layer's 733 -- a big drop signals
          # the fetch script itself broke, not just an upstream mismatch.
          n = len(d.get("districts", {}))
          if n < 700:
              fails.append(f"only {n} districts present, expected ~733")

          for slug, dist in d.get("districts", {}).items():
              for r in dist.get("records", []):
                  mn, mx, md = r["min_price"], r["max_price"], r["modal_price"]
                  if not (1 <= mn <= 200000 and 1 <= mx <= 200000 and 1 <= md <= 200000):
                      fails.append(f"{slug}/{r['commodity']}: price out of range")
                  if mn > mx:
                      fails.append(f"{slug}/{r['commodity']}: min above max")
                  if not r.get("arrival_date"):
                      fails.append(f"{slug}/{r['commodity']}: no arrival date")

          if fails:
              print("VALIDATION FAILED")
              for f in fails[:20]:
                  print("  -", f)
              sys.exit(1)

          total = sum(x["count"] for x in d["districts"].values())
          print(f"Validated {total} price rows across {n} districts.")
          if total == 0:
              print("No arrivals reported today. This is a normal market "
                    "condition, not an error; no price is carried forward.")
          PY

      - name: Commit if prices changed
        run: |
          git config user.name  "vindhya-data-bot"
          git config user.email "actions@github.com"
          git add dashboard/data/mandi_prices.json
          if git diff --staged --quiet; then
            echo "Prices unchanged since the last run."
          else
            git commit -m "chore(data): daily AGMARKNET mandi prices [skip ci]"
            git push
          fi
